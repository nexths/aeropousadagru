<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pousada | Seu lugar para descansar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* TRAVA DE LAYOUT (HTML E BODY) */
    html,
    body {
      width: 100%;
      min-height: 100dvh;
      overflow-x: hidden; /* Evita que a página role para os lados */
      position: relative;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: #fff;
      background: #252622;
    }

    /* =========================
       FUNDO E CONTAINER
    ========================= */

    .page {
      width: 100%;
      max-width: 100vw;
      min-height: 100dvh;
      position: relative;

      display: flex;
      justify-content: center;

      padding: 120px 20px 30px;

      overflow: hidden; /* Trava de segurança extra no container */
    }

    /* REGRA PARA QUANDO DEITAR O CELULAR (LANDSCAPE) */
    @media (orientation: landscape) and (max-height: 600px) {
      .page {
        padding-top: 30px;
        padding-bottom: 30px;
      }

      .content {
        max-width: 400px; /* Mantém o formato de cartão de celular centralizado */
        margin: 0 auto;
      }
    }

    .background {
      position: fixed;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(20, 21, 18, .58),
          rgba(20, 21, 18, .70)
        ),
        url("assets/background.jpeg");

      background-size: cover;
      background-position: center;

      filter: blur(2px);
      transform: scale(1.04);

      z-index: -2;
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;

      background: rgba(35, 36, 31, .25);
    }


    /* =========================
       CONTEÚDO
    ========================= */

    .content {
      width: 100%;
      max-width: 460px;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }


    /* =========================
       LOGO / PERFIL
    ========================= */

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;

      margin-bottom: 28px;
    }

    .logo {
      width: 110px;           /* Tamanho da bolinha maior */
      height: 110px;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      overflow: hidden;        /* Garante o formato 100% redondo */
      position: relative;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;     /* Mantém as proporções da imagem inteira lá dentro */
      /* transform: scale(1.4); */   /* COMENTADO: Removido o zoom que causava o corte */
    }

    .name {
      font-family: "Playfair Display", serif;

      font-size: 30px;
      font-weight: 400;

      line-height: 1.1;
    }

    .description {
      margin-top: 8px;

      font-size: 13px;

      color: rgba(255,255,255,.78);

      letter-spacing: .3px;
    }


    /* =========================
       LINKS
    ========================= */

    .links {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 12px;
    }

    .link {
      width: 100%;

      min-height: 58px;

      padding: 0 20px;

      border-radius: 14px;

      background: rgba(255,255,255,.93);

      color: #34352f;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      font-size: 14px;
      font-weight: 500;

      box-shadow:
        0 8px 25px rgba(0,0,0,.12);

      transition:
        transform .25s ease,
        background .25s ease;
    }

    .link:hover {
      transform: translateY(-2px);

      background: #fff;
    }

    .icon {
      position: absolute;
      left: 20px;

      width: 24px;

      font-size: 18px;

      opacity: .75;
    }


    /* =========================
       DESTAQUE WHATSAPP
    ========================= */

    .link.whatsapp {
      background: #e8eee5;
    }

    .link.whatsapp:hover {
      background: #f0f4ed;
    }


    /* =========================
       FRASE
    ========================= */

    .phrase {
      margin-top: 28px;

      font-family: "Playfair Display", serif;

      font-size: 17px;

      color: rgba(255,255,255,.88);

      line-height: 1.4;
    }


    /* =========================
       SOCIAL
    ========================= */

    .social {
      display: flex;
      gap: 18px;

      margin-top: 24px;
    }

    .social a {
      width: 40px;
      height: 40px;

      border: 1px solid rgba(255,255,255,.35);

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;

      font-size: 15px;

      transition: .25s ease;
    }

    .social a:hover {
      background: rgba(255,255,255,.15);
      transform: translateY(-2px);
    }


    /* =========================
       RODAPÉ
    ========================= */

    footer {
      margin-top: 30px;

      font-size: 10px;

      color: rgba(255,255,255,.48);

      letter-spacing: .5px;
    }


    /* =========================
       MOBILE
    ========================= */

/* =========================
       MOBILE (AJUSTADO LARGURA E ALTURA)
    ========================= */

    @media (max-width: 480px) {

      .page {
        padding: 40px 20px 20px; /* Reduz o espaço no topo e embaixo */
      }

      /* 1. LARGURA: Reduz o container principal para mostrar mais o fundo nas laterais */
      .content {
        max-width: 320px; /* Antes estava ocupando quase 100% (460px) */
      }

      /* 2. LOGO E CABEÇALHO */
      .logo {
        width: 80px;
        height: 80px;
        margin-bottom: 12px;
      }

      .name {
        font-size: 24px;
      }

      .description {
        font-size: 12px;
        margin-top: 4px;
      }

      /* 3. ALTURA E ESPAÇAMENTO DOS BOTÕES */
      .links {
        gap: 9px; /* Diminui a distância entre os botões (era 12px) */
      }

      .link {
        min-height: 46px; /* Altura mais fina (era 58px) */
        font-size: 13px;  /* Texto levemente ajustado para caber na nova largura */
        border-radius: 12px;
        padding: 0 15px 0 45px; /* Abre espaço para o ícone sem apertar o texto */
      }

      /* 4. ÍCONES */
      .icon-img {
        left: 12px;
        width: 26px;
        height: 26px;
      }

      /* 5. FRASE E RODAPÉ */
      .phrase {
        margin-top: 20px;
        font-size: 14px;
      }

      footer {
        margin-top: 18px;
      }

    }
    /* Estilo para as imagens dos ícones dentro dos botões */
    .icon-img {
      position: absolute;
      left: 20px;
      width: 38px;
      height: 35px;
      object-fit: contain;
    }

    /* Estilo para ícones padrão quando não for usar imagem PNG */
    .icon-emoji {
      position: absolute;
      left: 20px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
    }

  </style>
</head>


<body>

  <div class="page">

    <div class="background"></div>


    <main class="content">


      <!-- PERFIL -->

      <section class="profile">

        <div class="logo">
            <!-- Certifique-se de que a imagem 'assets/logo.png' seja a imagem inteira que você me mandou -->
            <img src="assets/logo.png" alt="AERO Pousada GRU">
        </div>

        <h1 class="name">
          AERO Pousada GRU
        </h1>

        <p class="description">
          Simples, tranquila e acolhedora.
        </p>

      </section>


      <!-- LINKS -->
      <nav class="links">

        <a class="link whatsapp" href="https://wa.me/5511974167457" target="_blank">
          <img src="assets/whatsapp-circle.png" class="icon-img" alt="WhatsApp">
          Reservar pelo WhatsApp
        </a>

        <!-- VISITAR O SITE -->
        <a class="link" href="https://aero-pousada-gru-2go77pr.gamma.site/" target="_blank">
          <img src="assets/site.png" class="icon-img" alt="Site">
          Nosso site
        </a>

        <a class="link" href="https://www.instagram.com/aero_pousada_gru/" target="_blank">
          <img src="assets/instagram.png" class="icon-img" alt="Instagram">
          Instagram
        </a>

        <a class="link" href="https://maps.app.goo.gl/8gzygU26xjs3apNXA" target="_blank">
          <img src="assets/location.png" class="icon-img" alt="Localização">
          Como chegar
        </a>

        <!-- AVALIE NO GOOGLE -->
        <a class="link" href="https://g.page/r/Cbz9eph1N_VREBM/review" target="_blank">
          <img src="assets/like.png" class="icon-img" alt="Deixe sua avaliação">
          Deixe sua avaliação
        </a>

        <!-- COMO DEVE FICAR: -->
        <a class="link" href="Tour Aero Pousada Gru/index.html">
          <img src="assets/fotografia.png" class="icon-img" alt="Acomodações">
          Conheça nossas acomodações
        </a>

      </nav>

      <!-- FRASE -->

      <p class="phrase">
        Um lugar acolhedor para<br>
        você se sentir em casa.
      </p>

      <footer>
        © 2026 AERO Pousada GRU
      </footer>


    </main>

  </div>

</body>
</html>
